name: Tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  unittest:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.15']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '26'
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: latest
          python-version: ${{ matrix.python }}
      - name: Install zsh
        run: sudo apt-get update && sudo apt-get install -y zsh
      - name: Test shell, calculator, and uv lifecycle
        env:
          OLNM_TEST_UV: '1'
        run: uv run --no-project python -m unittest discover -v
